  anubis:
    image: ghcr.io/techarohq/anubis:main
    container_name: anubis
    restart: unless-stopped
    user: "$PUID:$PGID"
    depends_on:
      crowdsec:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
    dns:
      - 1.1.1.1
    security_opt:
      - no-new-privileges=true
    expose:
      - 8080
    ports:
      - 9191:9090
    environment:
      - BIND=${BIND}
      - SERVE_ROBOTS_TXT
      - TARGET
      - POLICY_FNAME
      - TZ
      - REDIRECT_DOMAINS
      - PUBLIC_URL
      - COOKIE_DOMAIN
      - JWT_RESTRICTION_HEADER
      - USE_REMOTE_ADDRESS
      - ED25519_PRIVATE_KEY_HEX
    env_file:
      - .env
    volumes:
      - ./anubis:/data
      - ./anubis/logs/anubis.log:/data/logs/anubis.log
    healthcheck:
      test: ["CMD", "anubis", "--healthcheck"]
      interval: 5s
      timeout: 30s
      retries: 5
      start_period: 500ms
    networks:
      traefik:
        ipv6_address: "2001:db8:2::4"
        ipv4_address: "172.21.0.4"

