services:
  traefik:
    image: traefik:latest
    container_name: traefik
    restart: unless-stopped
    depends_on:
      crowdsec:
        condition: service_healthy
    security_opt:
      - no-new-privileges=true
    ports:
      - "80:80"
      - "443:443"

      - "8080:8080"
      - "2222:2222"

      # RDP
      - "3389:3389/tcp"
      - "3389:3389/udp"
    deploy:
      resources:
        limits:
          memory: 256M
    volumes:
      - "./traefik:/etc/traefik"
      - "./traefik/plugins-storage:/plugins-storage"
    environment:
      - TZ
      - CF_DNS_API_TOKEN
      - PUID
      - PGID
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      traefik:
        ipv6_address: "2001:db8:2::2"
        ipv4_address: "172.21.0.2"

  crowdsec:
    image: ghcr.io/crowdsecurity/crowdsec:latest
    container_name: crowdsec
    restart: unless-stopped
    security_opt:
      - no-new-privileges=true
    environment:
      - USER=crowdsec
      - GID
      - COLLECTIONS
      - CUSTOM_HOSTNAME
      - TZ
    env_file:
      - .env
    expose:
      - 8080
    ports:
      - 6060:6060
    deploy:
      resources:
        limits:
          memory: 256M
    volumes:
      - crowdsec_config:/etc/crowdsec:rw
      - crowdsec_data:/var/lib/crowdsec/data:rw
      - ./crowdsec/config/acquis.d:/etc/crowdsec/acquis.d:ro
      - ./crowdsec/config/notifications:/etc/crowdsec/notifications:ro
      - ./crowdsec/config/config.yaml:/etc/crowdsec/config.yaml:rw
      - ./crowdsec/config/profiles.yaml:/etc/crowdsec/profiles.yaml:ro
      - ./crowdsec/logs:/var/log/crowdsec:rw
      - ./traefik/logs:/var/log/traefik:ro
    healthcheck:
      test: ["CMD", "cscli", "lapi", "status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      traefik:
        ipv6_address: "2001:db8:2::3"
        ipv4_address: "172.21.0.3"

  cs-routeros-bouncer:
    image: ghcr.io/jmrplens/cs-routeros-bouncer:latest
    container_name: cs-routeros-bouncer
    restart: unless-stopped
    user: "$PUID:$PGID"
    depends_on:
      crowdsec:
        condition: service_healthy
    ports:
      - "2112:2112" # Prometheus metrics (optional)
    volumes:
      - ./routeros/config.yaml:/etc/cs-routeros-bouncer/config.yaml
      - ./routeros/logs:/var/log
    networks:
      traefik:
        ipv6_address: "2001:db8:2::7"
        ipv4_address: "172.21.0.7"

  anubis:
    image: ghcr.io/techarohq/anubis:main
    container_name: anubis
    restart: unless-stopped
    user: "$PUID:$PGID"
    depends_on:
      crowdsec:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
    security_opt:
      - no-new-privileges=true
    expose:
      - 8923
    ports:
      - 9191:9090
    environment:
      - BIND
      - DIFFICULTY
      - SERVE_ROBOTS_TXT
      - TARGET
      - POLICY_FNAME
      - TZ
      - REDIRECT_DOMAINS
      - PUBLIC_URL
      - COOKIE_DOMAIN
      - JWT_RESTRICTION_HEADER
      - USE_REMOTE_ADDRESS
      - ED25519_PRIVATE_KEY_HEX
    env_file:
      - .env
    volumes:
      - ./anubis:/data
    healthcheck:
      test: ["CMD", "anubis", "--healthcheck"]
      interval: 5s
      timeout: 30s
      retries: 5
      start_period: 500ms
    networks:
      traefik:
        ipv6_address: "2001:db8:2::4"
        ipv4_address: "172.21.0.4"

