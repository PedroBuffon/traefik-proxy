volumes:
  crowdsec_config:
  crowdsec_data:
  traefik_redis:

networks:
  traefik:
    name: traefik
    enable_ipv6: true
    ipam:
      config:
        - subnet: "172.21.0.0/16" # Change according to your needs
        - subnet: "2001:db8:2::/64"
    driver_opts:
          com.docker.network.driver.mtu: 1300

# Static ips on containers only for if you use the app.crowdsec.net, if you don't use the networks,
# the remediation components will have duplicated bouncers, each time you restart the container will get a new ip