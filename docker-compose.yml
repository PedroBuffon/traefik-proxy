services:
  traefik:
    image: traefik:v3.7.18
    container_name: traefik
    restart: unless-stopped
    depends_on:
      crowdsec:
        condition: service_healthy
    security_opt:
      - no-new-privileges=true
    ports:
      - "80:80"
      - "443:443"

      - "8080:8080"
    deploy:
      resources:
        limits:
          memory: 256M
    dns:
      - 1.1.1.1
    volumes:
      - "./traefik:/etc/traefik"
      - "./traefik/plugins-storage:/plugins-storage"
    environment:
      - TZ=${TZ}
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN}
      - PUID=${PUID}
      - PGID=${PGID}
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      traefik:
        ipv6_address: "2001:db8:2::2"
        ipv4_address: "172.21.0.2"

  crowdsec:
    image: ghcr.io/crowdsecurity/crowdsec:v1.8.2
    container_name: crowdsec
    restart: unless-stopped
    security_opt:
      - no-new-privileges=true
    environment:
      - TZ=${TZ}
      - GID=${GID}
      - COLLECTIONS=${COLLECTIONS}
      - CUSTOM_HOSTNAME=${CUSTOM_HOSTNAME}
      - USER=crowdsec
    env_file:
      - .env
    expose:
      - 8080
    ports:
      - 6060:6060
    deploy:
      resources:
        limits:
          memory: 256M
    dns:
      - 1.1.1.1
    volumes:
      - crowdsec_config:/etc/crowdsec:rw
      - crowdsec_data:/var/lib/crowdsec/data:rw
      - ./crowdsec/config/acquis.d:/etc/crowdsec/acquis.d:ro
      - ./crowdsec/config/notifications:/etc/crowdsec/notifications:ro
      - ./crowdsec/config/config.yaml:/etc/crowdsec/config.yaml:rw
      - ./crowdsec/config/profiles.yaml:/etc/crowdsec/profiles.yaml:ro
      - ./crowdsec/logs:/var/log/crowdsec:rw
      - ./traefik/logs:/var/log/traefik:ro
    healthcheck:
      test: ["CMD", "cscli", "lapi", "status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      traefik:
        ipv6_address: "2001:db8:2::3"
        ipv4_address: "172.21.0.3"

