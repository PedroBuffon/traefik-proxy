    Anubis-service:
      loadBalancer:
        servers:
          - url: http://10.84.181.2:8923
  middlewares:
    crowdsec:
      plugin:
        crowdsec:
          enabled: true
          logLevel: DEBUG
          LogFilePath: "/etc/traefik/logs/bouncer.log"
          crowdsecMode: live
          crowdsecLapiKey: "{{ env "CROWDSEC_BOUNCER_API_KEY" }}"
          crowdsecLapiHost: crowdsec:8080
          metricsUpdateIntervalSeconds: 600
          banHTMLFilePath: /etc/traefik/html/ban.html
    authentik:
      forwardAuth:
        address: http://10.84.181.243:9000/outpost.goauthentik.io/auth/traefik
        trustForwardHeader: true
        authResponseHeaders:
          - X-authentik-username
          - X-authentik-groups
          - X-authentik-entitlements
          - X-authentik-email
          - X-authentik-name
          - X-authentik-uid
          - X-authentik-jwt
          - X-authentik-meta-jwks
          - X-authentik-meta-outpost
          - X-authentik-meta-provider
          - X-authentik-meta-app
          - X-authentik-meta-version
          # Add the 'authorization' header to authResponseHeaders if you need proxy providers which
          # send a custom HTTP-Basic Authentication header based on values from authentik
          # - authorization
    anubis:
      forwardAuth:
        address: http://anubis:8923/.within.website/x/cmd/anubis/api/check
        trustForwardHeader: true
        authRequestHeaders:
          - X-Forwarded-Proto
          - X-Forwarded-Host
          - X-Forwarded-Uri
          - X-Forwarded-For
        authResponseHeaders:
          - X-Forwarded-User
          - X-Forwarded-Email

tls:
  stores:
    default:
      defaultGeneratedCert:
        resolver: cloudflare
        domain:
          main: buffon.cloud
          sans:
            - "*.buffon.cloud"
  options:
    tls-options:
      minVersion: VersionTLS12
      cipherSuites:
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305