        - authentik
    Pi-Hole Backup:
      rule: Host(`piholebk.buffon.cloud`)
      entryPoints:
        - https
      service: Pi-Hole Backup-service
      middlewares:
        - authentik
    PVE Nuc:
      rule: Host(`pvenuc.buffon.cloud`)
      entryPoints:
        - https
      service: PVE Nuc-service
    Nextcloud:
      rule: Host(`next.buffon.cloud`)
      entryPoints:
        - https
      service: Nextcloud-service
    N8N:
      rule: Host(`n8n.buffon.cloud`)
      entryPoints:
        - https
      service: N8N-service
    Notifiarr:
      rule: Host(`notifiarr.buffon.cloud`)
      entryPoints:
        - https
      service: Notifiarr-service
      middlewares:
        - authentik
    PBS:
      rule: Host(`pbs.buffon.cloud`)
      entryPoints:
        - https
      service: PBS-service
    Speedtest:
      rule: Host(`speedtest.buffon.cloud`)
      entryPoints:
        - https
      service: Speedtest-service
    qBittorrent:
      rule: Host(`torrent.buffon.cloud`)
      entryPoints:
        - https
      service: qBittorrent-service
      middlewares:
        - authentik
    Vaultwarden:
      rule: Host(`vault.buffon.cloud`)
      entryPoints:
        - https
      service: Vaultwarden-service
    Uptime-Kuma:
      rule: Host(`uptime.buffon.cloud`)
      entryPoints:
        - https
      service: Uptime-Kuma-service
      middlewares:
        - authentik
    Gitea:
      rule: Host(`git.buffon.cloud`)
      entryPoints:
        - https
      service: Gitea-service
    searXNG:
      rule: Host(`buffon.cloud`) || Host(`www.buffon.cloud`)
      entryPoints:
        - https
      service: searXNG-service
      middlewares:
        - anubis
    Plex:
      rule: Host(`plex.buffon.cloud`)
      entryPoints:
        - https
      service: Plex-service
    Traefik-Manager:
      rule: Host(`manager.buffon.cloud`)
      entryPoints:
        - https
      service: Traefik-Manager-service
      middlewares:
        - authentik
    mailcow:
      entryPoints:
        - https
      rule: "Host(`mail.buffon.cloud`)"
      service: mailcow-service
    mailcow-autoconfig:
      entryPoints:
        - https
      rule: "(Host(`autoconfig.buffon.cloud`) && Path(`/mail/config-v1.1.xml`))"
      service: mailcow-service
    mailcow-autodiscover:
      entryPoints:
        - https
      rule: "(Host(`autodiscover.buffon.cloud`) && Path(`/autodiscover/autodiscover.xml`))"
      service: mailcow-service
    Anubis:
      rule: Host(`anubis.buffon.cloud`)
      entryPoints:
        - https
      service: Anubis-service
