http:
  routers:
    catchall-router:
      rule: "HostRegexp(`{catchall:.*}`)"
      priority: 1
      entryPoints:
        - http
        - https
      middlewares:
        - crowdsec-bouncer
      service: noop@internal
    Authentik:
      rule: Host(`auth.buffon.cloud`)
      entryPoints:
        - https
      service: Authentik-service
    Bitmagnet:
      rule: Host(`magnet.buffon.cloud`)
      entryPoints:
        - https
      service: Bitmagnet-service
      middlewares:
        - authentik
    Sonarr:
      rule: Host(`sonarr.buffon.cloud`)
      entryPoints:
        - https
      service: Sonarr-service
      middlewares:
        - authentik
    Grafana:
      rule: Host(`grafana.buffon.cloud`)
      entryPoints:
        - https
      service: Grafana-service
    Radarr:
      rule: Host(`radarr.buffon.cloud`)
      entryPoints:
        - https
      service: Radarr-service
      middlewares:
        - authentik
    Tautulli:
      rule: Host(`tautulli.buffon.cloud`)
      entryPoints:
        - https
      service: Tautulli-service
      middlewares:
        - authentik
    Yamtrack:
      rule: Host(`track.buffon.cloud`)
      entryPoints:
        - https
      service: Yamtrack-service
    Prowlarr:
      rule: Host(`prowlarr.buffon.cloud`)
      entryPoints:
        - https
      service: Prowlarr-service
      middlewares:
        - authentik
    Shinkro:
      rule: Host(`shinkro.buffon.cloud`)
      entryPoints:
        - https
      service: Shinkro-service
      middlewares:
        - anubis
    PVE:
      rule: Host(`pve.buffon.cloud`)
      entryPoints:
        - https
      service: PVE-service
    NginxProxyManager:
      rule: Host(`nginx.buffon.cloud`)
      entryPoints:
        - https
      service: NginxProxyManager-service
    Portainer:
      rule: Host(`portainer.buffon.cloud`)
      entryPoints:
        - https
      service: Portainer-service
    Pi-Hole:
      rule: Host(`pihole.buffon.cloud`)
