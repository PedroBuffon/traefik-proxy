http:
  routers:
    catchall-router:
      rule: "HostRegexp(`{catchall:.*}`)"
      entryPoints:
        - http
        - https
      service: noop@internal
      priority: 1

    ping:
      rule: Path(`/ping`)
      entryPoints:
        - https
      service: ping@internal
      middlewares:
        - local-only

    Bitmagnet:
      rule: Host(`magnet.buffon.cloud`)
      entryPoints:
        - https
      service: Bitmagnet-service
      tls:
        certResolver: cloudflare
      middlewares:
        - local-only

    Sonarr:
      rule: Host(`sonarr.buffon.cloud`)
      entryPoints:
