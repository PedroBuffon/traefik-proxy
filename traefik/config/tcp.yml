tcp:
  routers:
    mailcow-https:
      entryPoints:
        - https
      rule: "HostSNI(`mail.buffon.cloud`) || HostSNI(`autoconfig.buffon.cloud`) || HostSNI(`autodiscover.buffon.cloud`) || HostSNI(`mta-sts.buffon.cloud`)"
      service: mailcow-https
      tls:
        passthrough: true

  services:
    mailcow-https:
      loadBalancer:
        servers:
          - address: "10.84.181.251:443"