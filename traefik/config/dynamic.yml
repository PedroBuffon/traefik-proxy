  middlewares:
    crowdsec-bouncer:
      forwardAuth:
        address: http://10.84.181.2:8922/api/v1/forwardAuth
        trustForwardHeader: true
    authentik:
      forwardAuth:
        address: http://10.84.181.243:9000/outpost.goauthentik.io/auth/traefik
        trustForwardHeader: true
        authResponseHeaders:
          - X-authentik-username
          - X-authentik-groups
          - X-authentik-entitlements
          - X-authentik-email
          - X-authentik-name
          - X-authentik-uid
          - X-authentik-jwt
          - X-authentik-meta-jwks
          - X-authentik-meta-outpost
          - X-authentik-meta-provider
          - X-authentik-meta-app
          - X-authentik-meta-version
          # Add the 'authorization' header to authResponseHeaders if you need proxy providers which
          # send a custom HTTP-Basic Authentication header based on values from authentik
          # - authorization
    anubis:
      forwardAuth:
        address: http://10.84.181.2:8923/.within.website/x/cmd/anubis/api/check
        trustForwardHeader: true
        authRequestHeaders:
          - X-Forwarded-Proto
          - X-Forwarded-Host
          - X-Forwarded-Uri
          - X-Forwarded-For
        authResponseHeaders:
          - X-Forwarded-User
          - X-Forwarded-Email