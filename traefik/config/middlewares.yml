http:
  middlewares:
    crowdsec:
      plugin:
        crowdsec:
          enabled: true
          logLevel: INFO
          LogFilePath: "/etc/traefik/logs/bouncer.log"
          crowdsecMode: live
          crowdsecLapiScheme: http
          crowdsecLapiKey: '{{ env "CROWDSEC_BOUNCER_API_KEY" }}'
          crowdsecLapiHost: crowdsec:8080
          metricsUpdateIntervalSeconds: 600
          captchaProvider: turnstile
          captchaSiteKey: '{{ env "CAPTCHA_SITE_KEY" }}'
          captchaSecretKey: '{{ env "CAPTCHA_SECRET_KEY" }}'
          captchaGracePeriodSeconds: 1800
          CaptchaFilePath: /etc/traefik/html/captcha.html
          BanFilePath: /etc/traefik/html/ban.html
          redisCacheEnabled: false
          redisCacheHost: redis:6379
          redisCacheUnreachableBlock: true

    authentik:
      forwardAuth:
        address: http://10.84.181.2:3004/outpost.goauthentik.io/auth/traefik
        trustForwardHeader: true
        maxResponseBodySize: 1048576 # 1MB
        authResponseHeaders:
          - X-authentik-username
          - X-authentik-groups
          - X-authentik-entitlements
          - X-authentik-email
          - X-authentik-name
          - X-authentik-uid
          - X-authentik-jwt
          - X-authentik-meta-jwks
          - X-authentik-meta-outpost
          - X-authentik-meta-provider
          - X-authentik-meta-app
          - X-authentik-meta-version
          # Add the 'authorization' header to authResponseHeaders if you need proxy providers which
          # send a custom HTTP-Basic Authentication header based on values from authentik
          # - authorization

    anubis:
      forwardAuth:
        address: http://anubis:8080/.within.website/x/cmd/anubis/api/check
        trustForwardHeader: true
        maxResponseBodySize: 1048576

    searxng-headers:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
        forceSTSHeader: true
        contentTypeNosniff: true
        browserXssFilter: true
        referrerPolicy: "strict-origin-when-cross-origin"
        permissionsPolicy: "camera=(), microphone=(), geolocation=()"
        frameDeny: true

    searxng-csp:
      headers:
        contentSecurityPolicy: >-
          upgrade-insecure-requests;
          default-src 'none';
          script-src 'self';
          style-src 'self' 'unsafe-inline';
          form-action 'self' https:;
          font-src 'self';
          frame-ancestors 'self';
          base-uri 'self';
          connect-src 'self';
          img-src * data:;
          frame-src https:;

    nextcloud-secure-headers:
      headers:
        hostsProxyHeaders:
          - "X-Forwarded-Host"
        referrerPolicy: "same-origin"
        customRequestHeaders:
          X-Forwarded-Proto: "https"

    local-only:
      ipAllowList:
        sourceRange:
          - "10.84.181.0/24"
          - "192.168.2.0/24"
          - "2804:10fc:200:e100::/56"
          - "177.152.32.38/32"

    geoblock:
      plugin:
        geoblock:
          silentStartUp: false
          allowLocalRequests: true
          logLocalRequests: false
          logAllowedRequests: false
          logApiRequests: false
          ignoreApiFailures: true
          logFilePath: "/etc/traefik/logs/geoblock.log"
          ipDatabaseCachePath: "/etc/traefik/geoblock/ip-cache.db"
          api: "https://get.geojs.io/v1/ip/country/{ip}"
          apiTimeoutMs: 750 # optional
          cacheSize: 15
          httpStatusCodeDeniedRequest: 404
          forceMonthlyUpdate: false
          allowUnknownCountries: false
          unknownCountryApiResponse: "nil"
          blackListMode: false
          addCountryHeader: true
          allowedIPAddresses:
            - 10.84.181.0/24
            - 192.168.2.0/24
            - 200.185.222.226/32
            - 2804:10fc:200:e100::/56
          excludedPathPatterns:
            - "^[^/]+/health$"                    # /health on any domain
            - "^[^/]+/status$"                    # /status on any domain
            - "^[^/]+/api/webhook/.*"             # /api/webhook/* on any domain
            - "^[^/]+/metrics.*"                  # /metrics* on any domain
          countries:
            - AQ # Antarctica
            - AR # Argentina
            - AM # Armenia
            - AU # Australia
            - AT # Austria
            - BE # Belgium
            - BR # Brazil
            - CA # Canada
            - CL # Chile
            - CN # China
            - DK # Denmark
            - FI # Finland
            - FR # France
            - DE # Germany
            - GL # Greenland
            - HU # Hungary
            - IS # Iceland
            - IE # Ireland
            - IT # Italy
            - JP # Japan
            - LU # Luxembourg
            - MX # Mexico
            - NL # Netherlands
            - NZ # New Zealand
            - NO # Norway
            - PY # Paraguay
            - PE # Peru
            - PL # Poland
            - PT # Portugal
            - ES # Spain
            - SE # Sweden
            - CH # Switzerland
            - US # United States of America